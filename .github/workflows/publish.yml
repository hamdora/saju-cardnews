name: 카드뉴스 렌더 & 인스타 발행

on:
  push:
    branches: [main]
    paths: ['posts/**', 'cardgen/**', 'assets/**']
  schedule:
    - cron: '7 * * * *'   # 매시 7분: 예약(publish_at) 게시물 확인
  workflow_dispatch:
    inputs:
      dry_run:
        description: '발행하지 않고 계획만 출력'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 한자 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install pillow numpy requests

      - name: 렌더링
        run: python scripts/render_all.py

      - name: 렌더 결과 커밋
        run: |
          git config user.name  "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add posts/*/rendered || true
          if ! git diff --cached --quiet; then
            git commit -m "render: 카드 이미지 갱신"
            git push
          fi
          echo "RAW_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 인스타 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DRY_RUN: ${{ (inputs.dry_run || secrets.IG_ACCESS_TOKEN == '') && '1' || '0' }}
        run: python scripts/publish.py

      - name: 발행 기록 커밋
        if: always()
        run: |
          git add posts/*/published.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "publish: 발행 기록"
            git push
          fi
