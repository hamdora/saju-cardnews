name: 인스타 토큰 갱신

on:
  schedule:
    - cron: '23 3 1,15 * *'   # 매월 1일·15일 (토큰 유효기간 60일)
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: 장기 토큰 갱신 후 Secret 교체
        env:
          TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          resp=$(curl -fsS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${TOKEN}")
          new=$(echo "$resp" | jq -r '.access_token')
          days=$(( $(echo "$resp" | jq -r '.expires_in') / 86400 ))
          echo "::add-mask::$new"
          if [ -n "${GH_TOKEN}" ]; then
            gh secret set IG_ACCESS_TOKEN --repo "$REPO" --body "$new"
            echo "토큰 갱신 완료 (유효 ${days}일)"
          else
            echo "::warning::GH_PAT 이 없어 Secret 을 교체하지 못했습니다. 유효 ${days}일."
          fi
